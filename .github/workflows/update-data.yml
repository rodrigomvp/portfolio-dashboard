name: update data

# Every weekday after the US close (22:17 UTC), download the whole price
# history again and commit data/prices.csv if anything changed. The deployed
# app rebuilds its database from that file, so it never calls Yahoo itself.
on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Download prices
        run: python scripts/update_data.py --full

      - name: Commit the snapshot if it changed
        run: |
          if [ -z "$(git status --porcelain -- data/prices.csv)" ]; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          git commit -m "data: prices up to $(date -u +%Y-%m-%d)"
          git push
